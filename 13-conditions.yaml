- name: conditions
  host: frontend
  become: yes
  tasks:
   - name: install nginx if state is redhat
     ansible.builtin.dnf:
      name: nginx
      state: present
     when: ansible_os_family == "Redhat"
     
   - name: install nginx if debian 
     ansible.builtin.apt:
      name: nginx
      state: present
     when: ansible_os_family == "Debian"