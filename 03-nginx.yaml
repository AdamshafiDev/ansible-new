 - name: install nginx
   hosts: web
   become: yes
   tasks:
   - name: inatll nginx
     ansible.builtin.package:
      name: nginx
      state: absent
   - name: remove  
     ansible.builtin.service:
       name: nginx
       state: stopped
       





